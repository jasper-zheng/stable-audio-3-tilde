[project]
name = "stable-audio-3-tilde"
version = "0.1.0"
description = "Export Stable Audio 3 (small-music) to ExecuTorch MLX .pte for the neural~ (Max/MSP) integration"
readme = "README.md"
# Tested on 3.10 and 3.12. See README.md "Prerequisites".
requires-python = ">=3.10,<3.14"
dependencies = [
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "numpy>=2.2.6",
    "packaging>=26.0",
    "safetensors>=0.7.0",
    # The export stack. executorch must match the ExecuTorch runtime the neural.gen~
    # externals link (1.5.1 for neural_tilde v0.1.0); its PyPI wheel ships the MLX
    # backend. torch is pinned to the version executorch 1.5.1 was built against, since
    # torch.export → ExecuTorch lowering needs the same torch at AOT time.
    # torchaudio 2.11.0 declares no torch pin and works with torch 2.14.
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "executorch==1.5.1",
    "neural-tilde>=0.1.0",
    "tqdm>=4.67.3",
    "huggingface-hub>=1.7.1",
    "transformers>=5.8.0",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
]

[project.scripts]
stable-audio = "stable_audio_3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stable_audio_3"]

[tool.ruff]
exclude = [
    "stable_audio_3/models",
    "stable_audio_3/inference",
    "stable_audio_3/interface",
    "stable_audio_3/data",
    "stable_audio_3/training",
]
